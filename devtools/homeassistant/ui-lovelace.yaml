title: Home
views:
  - title: Main Test Suite
    path: dev
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "# 🕰 DateTime Picker Card - Testing Suite"
          - type: entities
            entities:
              - input_datetime.test_date_time
              - input_datetime.test_date_only
              - input_datetime.test_time_only

          - type: markdown
            content: "### 1. Date & Time Entities (Combined)"
          - type: horizontal-stack
            cards:
              - type: custom:datetime-picker-card
                entity: input_datetime.test_date_time
                name: Date & Time - Default
              - type: custom:datetime-picker-card
                entity: input_datetime.test_date_time
                name: Date & Time - Custom Name

          - type: markdown
            content: "### 2. Date Only Entities"
          - type: horizontal-stack
            cards:
              - type: custom:datetime-picker-card
                entity: input_datetime.test_date_only
                name: Date Only - Standard
              - type: custom:datetime-picker-card
                entity: input_datetime.test_date_only
                name: Date Only - Hidden Name
                hide:
                  name: true

          - type: markdown
            content: "### 3. Time Only Entities"
          - type: horizontal-stack
            cards:
              - type: custom:datetime-picker-card
                entity: input_datetime.test_time_only
                name: Time Only - Standard
              - type: custom:datetime-picker-card
                entity: input_datetime.test_time_only
                name: Time Only - Hidden Icon
                hide:
                  icon: true

          - type: markdown
            content: "### 4. Edge & Error Cases"
          - type: custom:datetime-picker-card
            entity: input_datetime.non_existent_entity
            name: Invalid Entity Test